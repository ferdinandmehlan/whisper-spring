name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out sources including the whisper.cpp submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle with dependency and wrapper caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit

      - name: Cache node, pnpm and Playwright installations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gradle/nodejs
            .gradle/pnpm
            .gradle/playwright
            server-ui/node_modules
          key: node-toolchain-${{ runner.os }}-${{ hashFiles('server-ui/pnpm-lock.yaml') }}
          restore-keys: |
            node-toolchain-${{ runner.os }}-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          if-no-files-found: ignore
          path: |
            core/build/reports/
            core/build/test-results/
            core/data/test/output/
            server/build/reports/
            server/build/test-results/
            server/data/test/output/
            server-ui/test-results/
