minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 40320
strictDepBuilds: true
blockExoticSubdeps: true

update:
  ignoreDeps:
    - typescript # Keep typescript pinned at 6.0.3: eslint is not yet compatible with 7.x.

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: false
