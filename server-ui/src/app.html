<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Applied before first paint so the first paint is the user's palette,
      // not the dark default - a light user would otherwise see a dark flash
      // before hydration. The attribute is set on <html>, the only element
      // that exists pre-paint, and tokens.css attaches the palette to
      // :root[data-theme] directly.
      try {
        const stored = localStorage.getItem('theme');
        const light = stored
          ? stored === 'light'
          : !window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch {
        // Storage can be unavailable (private mode, blocked cookies): fall back
        // to the stylesheet default instead of failing the page.
      }
    </script>
    <title>Whisper Spring</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
