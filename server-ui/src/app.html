<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a light flash.
      // ThemeToggle.svelte reads the resulting class back and keeps it updated.
      try {
        const stored = localStorage.getItem('theme');
        const dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);

        // v2 has its own palette and its own key: the islands theme is not the
        // v1 slate/teal theme, so switching one must not restyle the other.
        // The attribute lands on <html> because the .v2 root does not exist yet;
        // theme.css resolves :root[data-v2-mode] down to .v2 for this reason.
        const v2Stored = localStorage.getItem('v2-mode');
        const v2Light = v2Stored
          ? v2Stored === 'light'
          : !window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.v2Mode = v2Light ? 'light' : 'dark';
      } catch {
        // Storage can be unavailable (private mode, blocked cookies): fall back
        // to the stylesheet default instead of failing the page.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
